<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, World!</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&display=swap");

      :root {
        color-scheme: dark;
        --ink: #f7f5ff;
        --muted: #c6c1df;
        --violet: #9b7bff;
        --cyan: #5ce1e6;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #100d20;
        color: var(--ink);
        font-family: "Manrope", system-ui, sans-serif;
      }

      .orb {
        position: absolute;
        width: 34rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(2px);
        opacity: .65;
        animation: drift 13s ease-in-out infinite alternate;
      }

      .orb-one { background: #663fff; top: -17rem; left: -10rem; }
      .orb-two { background: #006e8c; bottom: -20rem; right: -9rem; animation-delay: -7s; }

      main {
        position: relative;
        width: min(90vw, 720px);
        padding: clamp(2.5rem, 7vw, 5rem);
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 2rem;
        background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, .35);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 1.4rem;
        color: var(--cyan);
        font: 500 .76rem/1 "DM Mono", monospace;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 8ch;
        margin: 0;
        font-size: clamp(3.2rem, 10vw, 6.5rem);
        line-height: .98;
        letter-spacing: -.075em;
      }

      h1 span {
        color: transparent;
        background: linear-gradient(100deg, var(--cyan), #d1bdff 55%, #fff);
        background-clip: text;
      }

      .description {
        max-width: 38rem;
        margin: 1.8rem 0 2.3rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.7;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: .65rem;
        padding: .8rem 1rem;
        border-radius: 999px;
        background: rgba(7, 6, 20, .28);
        color: #edeaff;
        font: .75rem/1 "DM Mono", monospace;
      }

      .dot {
        width: .58rem;
        height: .58rem;
        border-radius: 50%;
        background: #78f7bd;
        box-shadow: 0 0 0 .3rem rgba(120, 247, 189, .14);
      }

      @keyframes drift {
        to { transform: translate(5rem, 3rem) scale(1.12); }
      }

      @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
    </style>
  </head>
  <body>
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <main>
      <p class="eyebrow">A fresh start</p>
      <h1>Hello, <span>World.</span></h1>
      <p class="description">A little corner of the internet, made with curiosity and a splash of color.</p>
      <div class="status"><span class="dot"></span> Everything is ready</div>
    </main>
  </body>
</html>
